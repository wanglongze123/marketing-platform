# benefit-order 服务的分布式形态配置。V4 新增。
spring:
  application:
    name: mp-benefit-order
  threads:
    virtual:
      enabled: true

  data:
    redis:
      host: ${MP_REDIS_HOST:localhost}
      port: ${MP_REDIS_PORT:6379}

  datasource:
    benefit:
      url: jdbc:mysql://${MP_MYSQL_HOST:localhost}:${MP_MYSQL_PORT:3306}/db_benefit?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      username: mp_benefit
      password: mp_benefit
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        # 主链路所在库，池最大
        maximum-pool-size: 15
        minimum-idle: 5

server:
  port: ${MP_SERVER_PORT:8083}

dubbo:
  application:
    name: mp-benefit-order
    qos-enable: false
    logger: slf4j
  protocol:
    name: tri
    # -1 表示随机端口。多副本部署时固定端口会撞，而撞的表现是第二个实例启动失败
    port: -1
    # 注册到注册中心的地址由此指定。
    #
    # 不指定时 Dubbo 自己挑一块网卡，而三机拓扑下每个容器接了两个网络（本层的
    # net-b/net-c 与共用的 net-infra）—— 它挑中层内网段时，别层的服务拿到地址却
    # 路由不过去，表现为 UNAVAILABLE: upstream xxx is unavailable 与 metadata
    # 拉取失败。服务发现看起来一切正常，只有调用全挂。
    #
    # 容器编排注入 MP_DUBBO_HOST（取容器名），走 DNS 解析到 infra 网段，
    # 三层之间由它承载连通性。
    host: ${MP_DUBBO_HOST:}
  registry:
    address: nacos://${MP_NACOS_HOST:localhost}:${MP_NACOS_PORT:8848}
  scan:
    base-packages: com.mp.benefit

mp:
  dubbo:
    remote: true
  event:
    # 事件传输方式。injvm 形态取默认的 spring（进程内总线），分布式取 rocketmq。
    # 换的只是 RewardEventConfig 里装配哪个 @Bean，发布与消费的业务代码一行不动
    transport: ${MP_EVENT_TRANSPORT:rocketmq}
  lock:
    enabled: ${MP_LOCK_ENABLED:true}
  pay:
    merchant-id: ${MP_MERCHANT_ID:MCH_LOCAL_DEMO}
  consult-token:
    secret: ${MP_CONSULT_SECRET:local-dev-consult-secret-do-not-use-in-prod}
    ttl-seconds: 900
  pay-notify:
    secret: ${MP_PAY_NOTIFY_SECRET:local-dev-pay-notify-secret-do-not-use-in-prod}

  # 可靠任务调度。三项都可由环境变量覆盖，kill -9 验证时压缩时序用：
  #
  #   默认租约 30s + 僵尸回收每 10 轮（RECLAIM_EVERY_N_ROUNDS 硬编码）× 扫描
  #   间隔 1s = 最坏接管延迟约 40 秒。演示等不及，验证脚本会压到 5s/500ms，
  #   接管延迟随之降到约 10 秒。
  #
  # 回收频率无法单独调——它是「每 N 轮一次」，只能通过扫描间隔间接影响。
  task:
    lease-seconds: ${MP_TASK_LEASE_SECONDS:30}
    interval-millis: ${MP_TASK_INTERVAL_MILLIS:1000}
    timer:
      enabled: ${MP_TASK_TIMER_ENABLED:true}

logging:
  level:
    root: INFO
    com.mp: DEBUG

rocketmq:
  name-server: ${MP_ROCKETMQ_NAMESRV:localhost:9876}
  producer:
    # 消费方。消费方也要配 producer group —— starter 在装配 RocketMQTemplate 时
    # 强制要求它非空，即便本服务从不发消息
    group: mp-grant-result-benefit
    # 发送失败不重试：事件是加速手段，丢了由查单兜底。框架层重试会在 broker
    # 短暂不可用时把一次回调处理拖成数秒
    retry-times-when-send-failed: 0
