# fission 服务的分布式形态配置。V4 新增。
spring:
  application:
    name: mp-fission
  threads:
    virtual:
      enabled: true

  datasource:
    fission:
      url: jdbc:mysql://${MP_MYSQL_HOST:localhost}:${MP_MYSQL_PORT:3306}/db_fission?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      username: mp_fission
      password: mp_fission
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        maximum-pool-size: 10
        minimum-idle: 2

server:
  port: ${MP_SERVER_PORT:8084}

dubbo:
  application:
    name: mp-fission
    qos-enable: false
    logger: slf4j
  protocol:
    name: tri
    # -1 表示随机端口。多副本部署时固定端口会撞，而撞的表现是第二个实例启动失败
    port: -1
    # 注册到注册中心的地址由此指定。
    #
    # 不指定时 Dubbo 自己挑一块网卡，而三机拓扑下每个容器接了两个网络（本层的
    # net-b/net-c 与共用的 net-infra）—— 它挑中层内网段时，别层的服务拿到地址却
    # 路由不过去，表现为 UNAVAILABLE: upstream xxx is unavailable 与 metadata
    # 拉取失败。服务发现看起来一切正常，只有调用全挂。
    #
    # 容器编排注入 MP_DUBBO_HOST（取容器名），走 DNS 解析到 infra 网段，
    # 三层之间由它承载连通性。
    host: ${MP_DUBBO_HOST:}
  registry:
    address: nacos://${MP_NACOS_HOST:localhost}:${MP_NACOS_PORT:8848}
  scan:
    base-packages: com.mp.fission

mp:
  dubbo:
    remote: true
  event:
    # 事件传输方式。injvm 形态取默认的 spring（进程内总线），分布式取 rocketmq。
    # 换的只是 RewardEventConfig 里装配哪个 @Bean，发布与消费的业务代码一行不动
    transport: ${MP_EVENT_TRANSPORT:rocketmq}

  # 配置键与权益侧各自独立（任务表分库，各库各有一个调度器），
  # 改一个不会作用于另一个——多实例验证时两侧都要配
  fission:
    task:
      lease-seconds: ${MP_FISSION_TASK_LEASE_SECONDS:30}
      interval-millis: ${MP_FISSION_TASK_INTERVAL_MILLIS:1000}
      timer:
        # 同时管住调度器与到期关系播种器：「播了没人跑」与「有人跑但没得播」
        # 都是半截状态，故共用一个开关
        enabled: ${MP_FISSION_TASK_TIMER_ENABLED:true}
    filter:
      # 好友过滤下推。置 false 走基线实现（逐用户查），仅用于产出对照数据
      pushdown: ${MP_FISSION_PUSHDOWN:true}

logging:
  level:
    root: INFO
    com.mp: DEBUG

rocketmq:
  name-server: ${MP_ROCKETMQ_NAMESRV:localhost:9876}
  producer:
    # 消费方。消费方也要配 producer group —— starter 在装配 RocketMQTemplate 时
    # 强制要求它非空，即便本服务从不发消息
    group: mp-grant-result-fission
    # 发送失败不重试：事件是加速手段，丢了由查单兜底。框架层重试会在 broker
    # 短暂不可用时把一次回调处理拖成数秒
    retry-times-when-send-failed: 0
