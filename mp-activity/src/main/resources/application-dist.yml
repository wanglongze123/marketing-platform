# activity 服务的分布式形态配置。V4 新增。
#
# 单进程形态不读本文件（那时由 mp-gateway 的 application.yml + application-local.yml 承载），
# 故这里只写「作为独立服务时才需要的东西」，不重复业务开关。
spring:
  application:
    name: mp-activity
  threads:
    virtual:
      enabled: true

  datasource:
    # 只配自己那个库。拆服务后本进程再没有别库的连接池 ——
    # 「禁止跨库 JOIN」从权限约束升级为物理约束：连都连不上
    activity:
      url: jdbc:mysql://${MP_MYSQL_HOST:localhost}:${MP_MYSQL_PORT:3306}/db_activity?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      username: mp_activity
      password: mp_activity
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        maximum-pool-size: 10
        minimum-idle: 2

server:
  port: ${MP_SERVER_PORT:8081}

dubbo:
  application:
    name: mp-activity
    qos-enable: false
    logger: slf4j
  protocol:
    name: tri
    # -1 表示随机端口。多副本部署时固定端口会撞，而撞的表现是第二个实例启动失败
    port: -1
    # 注册到注册中心的地址由此指定。
    #
    # 不指定时 Dubbo 自己挑一块网卡，而三机拓扑下每个容器接了两个网络（本层的
    # net-b/net-c 与共用的 net-infra）—— 它挑中层内网段时，别层的服务拿到地址却
    # 路由不过去，表现为 UNAVAILABLE: upstream xxx is unavailable 与 metadata
    # 拉取失败。服务发现看起来一切正常，只有调用全挂。
    #
    # 容器编排注入 MP_DUBBO_HOST（取容器名），走 DNS 解析到 infra 网段，
    # 三层之间由它承载连通性。
    host: ${MP_DUBBO_HOST:}
  registry:
    address: nacos://${MP_NACOS_HOST:localhost}:${MP_NACOS_PORT:8848}
  scan:
    base-packages: com.mp.activity

mp:
  # 本服务不消费任何下游，无需远程引用配置。这一项仍显式写出 ——
  # 缺省会让人以为是漏配的
  dubbo:
    remote: true

logging:
  level:
    root: INFO
    com.mp: DEBUG
