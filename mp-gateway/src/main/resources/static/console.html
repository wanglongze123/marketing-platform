<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>调试控制台 · 营销活动平台</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --line: #2a2f3a;
    --text: #e6e8ec;
    --text-2: #b8bfcc;
    --muted: #8b93a3;
    --accent: #4c8dff;
    --ok: #35c58a;
    --warn: #e8b339;
    --err: #ef5f5f;
    --unknown: #a97bd6;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 13.5px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  header {
    padding: 11px 18px; border-bottom: 1px solid var(--line); background: var(--panel);
    display: flex; align-items: center; gap: 13px; flex-wrap: wrap;
    position: sticky; top: 0; z-index: 40;
  }
  header h1 { font-size: 14.5px; margin: 0; font-weight: 600; }
  header .sub { color: var(--muted); font-size: 12px; }
  header a { color: var(--muted); font-size: 12.5px; text-decoration: none; padding: 4px 10px;
    border: 1px solid var(--line); border-radius: 5px; }
  header a:hover { color: var(--accent); border-color: var(--accent); }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; background: var(--muted); }
  .dot.up { background: var(--ok); } .dot.down { background: var(--err); }

  .wrap { display: grid; grid-template-columns: minmax(330px, 380px) 1fr; gap: 14px; padding: 14px; align-items: start; }
  @media (max-width: 940px) { .wrap { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .card + .card { margin-top: 14px; }
  .card > h2 {
    margin: 0; padding: 10px 13px; font-size: 12.5px; font-weight: 600;
    border-bottom: 1px solid var(--line); background: var(--panel-2);
    display: flex; align-items: center; gap: 8px;
  }
  .card > h2 small { color: var(--muted); font-weight: 400; font-family: var(--mono); font-size: 11px; }
  .card > h2 .r { margin-left: auto; display: flex; gap: 7px; align-items: center; }
  .body { padding: 13px; }

  label { display: block; font-size: 11.5px; color: var(--muted); margin: 9px 0 4px; }
  label:first-child { margin-top: 0; }
  input, select {
    width: 100%; padding: 6px 8px; background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 5px; font-family: var(--mono); font-size: 12.5px;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  .row { display: flex; gap: 8px; } .row > div { flex: 1; min-width: 0; }
  button {
    padding: 7px 13px; border-radius: 5px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--text-2); cursor: pointer; font: inherit; font-size: 12.5px;
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--text); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.pri { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
  button.pri:hover:not(:disabled) { filter: brightness(1.13); color: #fff; }
  button.sm { padding: 3px 9px; font-size: 11.5px; }
  .btns { display: flex; gap: 7px; margin-top: 12px; flex-wrap: wrap; }

  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 3px;
    font-family: var(--mono); font-size: 11.5px; font-weight: 500; border: 1px solid transparent;
  }
  .b-ok   { background: rgba(53,197,138,.13); color: var(--ok);      border-color: rgba(53,197,138,.3); }
  .b-wait { background: rgba(232,179,57,.13); color: var(--warn);    border-color: rgba(232,179,57,.3); }
  .b-err  { background: rgba(239,95,95,.13);  color: var(--err);     border-color: rgba(239,95,95,.3); }
  .b-unk  { background: rgba(169,123,214,.14);color: var(--unknown); border-color: rgba(169,123,214,.32); }
  .b-idle { background: rgba(139,147,163,.12);color: var(--muted);   border-color: rgba(139,147,163,.28); }

  /* 场景 */
  .scn { border-bottom: 1px solid var(--line); }
  .scn:last-of-type { border-bottom: none; }
  .scn-h { padding: 9px 13px; display: flex; align-items: center; gap: 10px; }
  .scn-h:hover { background: var(--panel-2); }
  .scn-h .t { flex: 1; min-width: 0; }
  .scn-h .t b { font-weight: 600; font-size: 12.5px; }
  .scn-h .t div { color: var(--muted); font-size: 11.5px; }
  .scn-h .t code { font-family: var(--mono); background: var(--bg); padding: 1px 5px; border-radius: 3px; font-size: 11px; }
  .steps { padding: 0 13px 12px; display: none; }
  .scn.open .steps { display: block; }
  .step {
    display: flex; gap: 9px; align-items: flex-start; padding: 5px 0;
    font-family: var(--mono); font-size: 11.5px; color: var(--text-2);
  }
  .step .ic { width: 15px; flex: none; text-align: center; }
  .step.pass .ic { color: var(--ok); } .step.fail .ic { color: var(--err); }
  .step.run .ic { color: var(--warn); } .step.todo { color: var(--muted); }
  .step .msg { flex: 1; min-width: 0; word-break: break-all; }
  .step .msg em { color: var(--muted); font-style: normal; }

  /* 三状态线 */
  .lines { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-bottom: 13px; }
  .line { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 9px 10px; }
  .line .k { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
  .flow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 13px; font-size: 12px; }
  .flow .s { padding: 3px 10px; border-radius: 4px; background: var(--bg); border: 1px solid var(--line);
    color: var(--muted); font-family: var(--mono); font-size: 11.5px; }
  .flow .s.done { border-color: rgba(53,197,138,.4); color: var(--ok); }
  .flow .s.cur { border-color: var(--accent); color: var(--accent); }
  .flow .a { color: var(--muted); font-size: 11px; }

  .kv { display: grid; grid-template-columns: 100px 1fr; gap: 5px 11px; font-size: 12.5px; }
  .kv .k { color: var(--muted); }
  .kv .v { font-family: var(--mono); word-break: break-all; }
  table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); font-family: var(--mono); word-break: break-all; }
  th { color: var(--muted); font-weight: 500; font-family: inherit; }
  tr:last-child td { border-bottom: none; }
  pre {
    margin: 0; padding: 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
    font-family: var(--mono); font-size: 11.5px; line-height: 1.5; overflow-x: auto;
    max-height: 300px; overflow-y: auto; color: var(--text-2);
  }
  .empty { color: var(--muted); font-size: 12.5px; padding: 8px 0; }
  .hint {
    font-size: 11.5px; color: var(--muted); margin-top: 9px; padding: 8px 10px;
    background: var(--bg); border-radius: 5px; border-left: 2px solid var(--line); line-height: 1.65;
  }
  .hint code { font-family: var(--mono); }
  .banner { padding: 8px 11px; border-radius: 5px; font-size: 12.5px; margin-bottom: 12px; display: none; font-family: var(--mono); }
  .banner.show { display: block; }
  .banner.ok { background: rgba(53,197,138,.1); color: var(--ok); border: 1px solid rgba(53,197,138,.28); }
  .banner.bad { background: rgba(239,95,95,.1); color: var(--err); border: 1px solid rgba(239,95,95,.28); }

  details.adv > summary {
    cursor: pointer; font-size: 12px; color: var(--muted); padding: 4px 0; list-style: none;
    display: flex; align-items: center; gap: 6px;
  }
  details.adv > summary::-webkit-details-marker { display: none; }
  details.adv > summary::before { content: '▸'; }
  details.adv[open] > summary::before { content: '▾'; }

  .log { max-height: 400px; overflow-y: auto; }
  .log-i { border-bottom: 1px solid var(--line); }
  .log-i:last-child { border-bottom: none; }
  .log-h { padding: 7px 12px; cursor: pointer; display: flex; gap: 9px; align-items: center;
    font-family: var(--mono); font-size: 11.5px; }
  .log-h:hover { background: var(--panel-2); }
  .log-h .m { color: var(--accent); font-weight: 600; min-width: 34px; }
  .log-h .u { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .log-h .ms { color: var(--muted); font-size: 11px; }
  .log-b { display: none; padding: 0 12px 10px; }
  .log-i.open .log-b { display: block; }
  .log-b h4 { margin: 8px 0 4px; font-size: 10.5px; color: var(--muted); font-weight: 500;
    text-transform: uppercase; letter-spacing: .05em; }
</style>
</head>
<body>

<header>
  <h1>调试控制台</h1>
  <span class="sub">权益售卖 V1</span>
  <span class="sub"><span class="dot" id="hDot"></span> <span id="hTxt">检测中…</span></span>
  <span style="margin-left:auto"></span>
  <a href="index.html">← 用户购买页</a>
</header>

<div class="wrap">

  <!-- 左 -->
  <div>
    <div class="card">
      <h2>场景回归 <small>每步带预期断言</small>
        <span class="r"><button class="sm" id="btnRunAll">全部运行</button></span>
      </h2>
      <div id="scns"></div>
    </div>

    <div class="card">
      <h2>手动调用</h2>
      <div class="body">
        <div class="row">
          <div>
            <label>userId</label>
            <input id="userId" value="U001">
          </div>
          <div style="flex:0 0 108px">
            <label>quantity</label>
            <input id="quantity" value="1">
          </div>
        </div>
        <label>clientReqNo <span style="color:var(--accent)">（幂等键组成，重放即不改）</span></label>
        <div class="row">
          <div><input id="clientReqNo"></div>
          <div style="flex:0 0 78px"><button style="width:100%" id="btnNewReq">换新</button></div>
        </div>
        <div class="btns">
          <button class="pri" id="btnTrade">下单</button>
          <button id="btnPayOk">回调 SUCCESS</button>
          <button id="btnPayFail">回调 FAILED</button>
          <button id="btnQuery">查询</button>
        </div>

        <details class="adv" style="margin-top:12px">
          <summary>高级参数</summary>
          <div class="row">
            <div>
              <label>activityId</label>
              <input id="activityId" value="ACT_DEMO_001">
            </div>
            <div>
              <label>skuId</label>
              <input id="skuId" value="SKU_DEMO_001">
            </div>
          </div>
          <div class="row">
            <div>
              <label>payAmount（分，留空取应付）</label>
              <input id="payAmount" placeholder="自动">
            </div>
            <div style="flex:0 0 96px">
              <label>currency</label>
              <input id="currency" value="CNY">
            </div>
          </div>
          <div class="row">
            <div>
              <label>notifySeq（留空自动）</label>
              <input id="notifySeq" placeholder="自动">
            </div>
            <div>
              <label>merchantId</label>
              <input id="merchantId" value="M001">
            </div>
          </div>
          <div class="hint">
            回调按 <code>outTradeNo</code>（= bizNo）定位主单，不用 tradeNo —— tradeNo 存在「支付下单成功但回填前崩溃」的 NULL 窗口。
          </div>
        </details>
      </div>
    </div>
  </div>

  <!-- 右 -->
  <div>
    <div class="card">
      <h2>订单状态
        <small id="curBiz">未选择</small>
        <span class="r">
          <select id="bizPick" style="width:auto;max-width:230px;font-size:11.5px;padding:3px 7px"></select>
          <button class="sm" id="btnRefresh">刷新</button>
        </span>
      </h2>
      <div class="body">
        <div class="banner" id="banner"></div>
        <div class="flow">
          <span class="s" data-s="created">建单</span><span class="a">→</span>
          <span class="s" data-s="paid">支付</span><span class="a">→</span>
          <span class="s" data-s="granting">履约</span><span class="a">→</span>
          <span class="s" data-s="done">完成</span>
        </div>
        <div class="lines">
          <div class="line"><div class="k">payStatus 支付线</div><span class="badge b-idle" id="sPay">—</span></div>
          <div class="line"><div class="k">grantStatus 发放线</div><span class="badge b-idle" id="sGrant">—</span></div>
          <div class="line"><div class="k">refundStatus 退款线</div><span class="badge b-idle" id="sRefund">—</span></div>
        </div>
        <div class="kv" id="kv"><div class="k">—</div><div class="v">尚未查询</div></div>
      </div>
    </div>

    <div class="card">
      <h2>履约明细 <small>按 providerType 分组，每组一个 grantOpNo</small></h2>
      <div class="body" id="ff"><div class="empty">暂无履约记录（支付成功后产生）</div></div>
    </div>

    <div class="card">
      <h2>请求日志 <small>点击展开报文</small>
        <span class="r"><button class="sm" id="btnClearLog">清空</button></span>
      </h2>
      <div class="log" id="log"><div class="empty" style="padding:13px">还没有请求</div></div>
    </div>
  </div>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);

const CLS = {
  WAIT_PAY: 'b-wait', CLOSING: 'b-unk', PAY_SUCCESS: 'b-ok', PAY_FAILED: 'b-err', CLOSED: 'b-idle',
  NOT_START: 'b-idle', GRANTING: 'b-wait', GRANT_SUCCESS: 'b-ok', GRANT_FAILED: 'b-err', GRANT_UNKNOWN: 'b-unk',
  SUCCESS: 'b-ok', FAILED: 'b-err', UNKNOWN: 'b-unk',
  NONE: 'b-idle', REVOKING: 'b-wait', REVOKE_FAILED: 'b-err',
  REFUNDING: 'b-wait', REFUND_SUCCESS: 'b-ok', REFUND_FAILED: 'b-err',
};
const cls = s => CLS[s] || 'b-idle';
const yuan = c => c == null ? '—' : '¥' + (c / 100).toFixed(2) + ' <span style="color:var(--muted)">(' + c + '分)</span>';
const esc = s => String(s == null ? '' : s)
  .replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* 错误码释义，取自 ErrorCode，不新造码 */
const CODE_TXT = {
  0: 'success',
  1711: '价格不一致（V2 起用）',
  1712: '库存不足（V2 起用）',
  1713: '超出限购（V2 起用）',
  1731: '支付金额/币种不一致 —— 不推进状态，触发 P0',
  4001: '入参缺失或非法',
  4003: '凭证非法或过期（V2 起用）',
  5001: '下游超时/未知 —— 按 UNKNOWN 查单收敛，不得判失败',
};

/* ---------- HTTP + 日志 ---------- */
let logSeq = 0;
async function call(method, path, body) {
  const t0 = performance.now();
  let json = null, err = null;
  try {
    const opt = { method, headers: {} };
    if (body !== undefined) {
      opt.headers['Content-Type'] = 'application/json';
      opt.body = JSON.stringify(body);
    }
    const r = await fetch(path, opt);
    const text = await r.text();
    try { json = JSON.parse(text); }
    catch { json = { code: -1, message: 'HTTP ' + r.status, _raw: text }; }
  } catch (e) { err = e.message || String(e); }
  logReq(method, path, body, json, Math.round(performance.now() - t0), err);
  if (err) banner(false, '请求失败：' + err + '（服务是否在 8080 运行？）');
  return json;
}

function logReq(method, path, body, resp, ms, err) {
  if (logSeq === 0) $('log').innerHTML = '';
  logSeq++;
  const code = err ? null : resp && resp.code;
  const c = err ? 'b-err' : code === 0 ? 'b-ok' : 'b-wait';
  const el = document.createElement('div');
  el.className = 'log-i open';
  el.innerHTML = `
    <div class="log-h">
      <span class="m">${esc(method)}</span>
      <span class="u">${esc(path)}</span>
      <span class="badge ${c}">${err ? 'ERR' : 'code ' + code}</span>
      <span class="ms">${ms}ms</span>
    </div>
    <div class="log-b">
      ${body ? '<h4>Request</h4><pre>' + esc(JSON.stringify(body, null, 2)) + '</pre>' : ''}
      <h4>Response</h4><pre>${esc(err ? err : JSON.stringify(resp, null, 2))}</pre>
      ${CODE_TXT[code] ? '<h4>code ' + code + '</h4><div class="hint">' + esc(CODE_TXT[code]) + '</div>' : ''}
      ${resp && resp.traceId ? '<h4>traceId</h4><pre>' + esc(resp.traceId) + '</pre>' : ''}
    </div>`;
  el.querySelector('.log-h').onclick = () => el.classList.toggle('open');
  $('log').prepend(el);
  [...$('log').querySelectorAll('.log-i')].slice(1).forEach(n => n.classList.remove('open'));
}

function banner(ok, msg) {
  const b = $('banner');
  b.className = 'banner show ' + (ok ? 'ok' : 'bad');
  b.textContent = msg;
}

/* ---------- 参数 ---------- */
const val = id => $(id).value.trim();
const newReqNo = () => 'REQ' + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2, 6).toUpperCase();
const newNotifySeq = () => 'NS' + Date.now().toString(36).slice(-6).toUpperCase();

/* ---------- 端点封装 ---------- */
function tradeBody(o = {}) {
  return {
    userId: o.userId || val('userId'),
    activityId: o.activityId || val('activityId'),
    skuId: o.skuId || val('skuId'),
    clientReqNo: o.clientReqNo || val('clientReqNo') || newReqNo(),
    quantity: o.quantity != null ? o.quantity : Number(val('quantity') || 1),
  };
}
const doTrade = o => call('POST', '/api/benefit/trade', tradeBody(o));

function cbBody(bizNo, o = {}) {
  const amt = o.payAmount != null ? o.payAmount
    : (val('payAmount') ? Number(val('payAmount')) : (known[bizNo] || {}).amount);
  return {
    outTradeNo: bizNo,
    tradeNo: 'PAY_' + bizNo,
    notifySeq: o.notifySeq || val('notifySeq') || newNotifySeq(),
    payStatus: o.payStatus || 'SUCCESS',
    payAmount: amt != null ? amt : 9900,
    currency: o.currency || val('currency') || 'CNY',
    merchantId: o.merchantId || val('merchantId') || 'M001',
  };
}
const doCallback = (bizNo, o) => call('POST', '/api/benefit/pay-callback', cbBody(bizNo, o));
const doQuery = bizNo => call('GET', '/api/benefit/order/' + encodeURIComponent(bizNo));

/* ---------- bizNo 历史 ---------- */
const known = {};          // bizNo -> { amount }
let curBizNo = null;

function remember(bizNo, amount) {
  known[bizNo] = { amount };
  const opts = Object.keys(known).reverse()
    .map(b => `<option value="${esc(b)}"${b === curBizNo ? ' selected' : ''}>${esc(b)}</option>`);
  $('bizPick').innerHTML = opts.join('') || '<option value="">（无）</option>';
}
function select(bizNo) {
  curBizNo = bizNo;
  $('curBiz').textContent = bizNo || '未选择';
  if (bizNo && known[bizNo]) remember(bizNo, known[bizNo].amount);
}

/* ---------- 渲染 ---------- */
function render(d) {
  select(d.bizNo);
  $('sPay').textContent = d.payStatus;       $('sPay').className = 'badge ' + cls(d.payStatus);
  $('sGrant').textContent = d.grantStatus;   $('sGrant').className = 'badge ' + cls(d.grantStatus);
  $('sRefund').textContent = d.refundStatus; $('sRefund').className = 'badge ' + cls(d.refundStatus);

  $('kv').innerHTML = `
    <div class="k">bizNo</div><div class="v">${esc(d.bizNo)}</div>
    <div class="k">tradeNo</div><div class="v">${esc(d.tradeNo || '—')}</div>
    <div class="k">userId</div><div class="v">${esc(d.userId)}</div>
    <div class="k">activityId</div><div class="v">${esc(d.activityId)}</div>
    <div class="k">skuId</div><div class="v">${esc(d.skuId)}</div>
    <div class="k">应付</div><div class="v">${yuan(d.orderAmount)}</div>
    <div class="k">实付</div><div class="v">${yuan(d.payAmount)}</div>
    <div class="k">configVersion</div><div class="v">${esc(d.configVersion)} <span style="color:var(--muted)">（下单时冻结）</span></div>`;

  const ff = d.fulfillments || [];
  $('ff').innerHTML = !ff.length
    ? '<div class="empty">暂无履约记录（支付成功后产生）</div>'
    : `<table>
        <thead><tr><th>权益项</th><th>供应方</th><th>下游单号</th><th>状态</th></tr></thead>
        <tbody>${ff.map(f => `<tr>
          <td>${esc(f.benefitItemId)}</td>
          <td>${esc(f.providerType)}</td>
          <td>${esc(f.providerOrderNo || '—')}</td>
          <td><span class="badge ${cls(f.grantStatus)}">${esc(f.grantStatus)}</span></td>
        </tr>`).join('')}</tbody></table>
      <div class="hint">
        明细用 <code>ItemGrantStatus</code>（无前缀），主单用 <code>GrantStatus</code>（GRANT_ 前缀）——
        两张表的列同名但是不同层级，前缀是唯一区分手段。
      </div>`;

  // 展示态由三条子状态线派生，不落库
  const st = { created: true, paid: false, granting: false, done: false };
  if (d.payStatus === 'PAY_SUCCESS') st.paid = true;
  if (['GRANTING', 'GRANT_SUCCESS', 'GRANT_FAILED', 'GRANT_UNKNOWN'].includes(d.grantStatus)) st.granting = true;
  if (d.grantStatus === 'GRANT_SUCCESS') st.done = true;
  const order = ['created', 'paid', 'granting', 'done'];
  const cur = order.findIndex(k => !st[k]);
  document.querySelectorAll('.flow .s').forEach(el => {
    const k = el.dataset.s;
    el.className = 's' + (st[k] ? ' done' : order.indexOf(k) === cur ? ' cur' : '');
  });
}

async function refresh(bizNo) {
  bizNo = bizNo || curBizNo;
  if (!bizNo) { banner(false, '先下一单，或从下拉里选一个 bizNo'); return null; }
  const r = await doQuery(bizNo);
  if (!r) return null;
  if (r.code !== 0) { banner(false, `查询失败 ${r.code}：${r.message}`); return null; }
  render(r.data);
  return r.data;
}

/* ============================================================
   场景回归 —— 每步声明预期，跑完给通过/失败
   ============================================================ */
const SCENARIOS = [
  {
    id: 'happy', name: '正常全链路', desc: '下单 → 回调 SUCCESS → 两供应方各发一次 → GRANT_SUCCESS',

        remember(r.data.bizNo, r.data.orderAmount);

      });
      await t.step(`应付 ${a.orderAmount} 分，期望 payStatus=WAIT_PAY`, async () => {
        t.assert(a.payStatus === 'WAIT_PAY', 'payStatus=' + a.payStatus);
        t.assert(!!a.tradeNo, 'tradeNo 未回填');

      await t.step('回调 SUCCESS，期望 code=0', async () => {
        const cb = await doCallback(a.bizNo, { payAmount: a.orderAmount, notifySeq: newNotifySeq() });
        t.assert(cb && cb.code === 0, `code=${cb && cb.code} ${cb && cb.message || ''}`);
      });
      const d = await t.step('查单，期望 PAY_SUCCESS + GRANT_SUCCESS', async () => {
        const d = await refresh(a.bizNo);
        t.assert(d, '查询失败');
        t.assert(d.payStatus === 'PAY_SUCCESS', 'payStatus=' + d.payStatus);
        t.assert(d.grantStatus === 'GRANT_SUCCESS', 'grantStatus=' + d.grantStatus);

        const ps = new Set(ff.map(f => f.providerType));

        t.assert(ff.every(f => f.grantStatus === 'SUCCESS'), '存在非 SUCCESS 明细');
        t.assert(ff.every(f => !!f.providerOrderNo), '存在未回填下游单号的明细');
      });
    },
  },
  {
    id: 'idem', name: '幂等重放', desc: '同一 clientReqNo 再下一次，期望同一 bizNo、不重复建单',
    async run(t) {
      const reqNo = newReqNo();
      const a = await t.step('首次下单', async () => {
        const r = await doTrade({ clientReqNo: reqNo });
        t.assert(r && r.code === 0, `code=${r && r.code}`);
        remember(r.data.bizNo, r.data.orderAmount);
        return r.data;
      });
      await t.step('同 clientReqNo 重放，期望返回同一 bizNo', async () => {
        const r = await doTrade({ clientReqNo: reqNo });
        t.assert(r && r.code === 0, `code=${r && r.code}`);
        t.assert(r.data.bizNo === a.bizNo, `bizNo ${a.bizNo} → ${r.data.bizNo}`);
        t.note('幂等键 = userId + activityId + skuId + clientReqNo');
      });
      await refresh(a.bizNo);
    },
  },
  {
    id: 'dupcb', name: '重复支付回调', desc: '已成功单再收一次通知，期望状态与履约行数都不变',
    async run(t) {
      const a = await t.step('下单 + 首次回调 SUCCESS', async () => {
        const r = await doTrade({ clientReqNo: newReqNo() });
        t.assert(r && r.code === 0, `code=${r && r.code}`);
        remember(r.data.bizNo, r.data.orderAmount);
        const cb = await doCallback(r.data.bizNo, { payAmount: r.data.orderAmount, notifySeq: newNotifySeq() });
        t.assert(cb && cb.code === 0, `回调 code=${cb && cb.code}`);

        const d = await refresh(a.bizNo);
        t.assert(d && d.grantStatus === 'GRANT_SUCCESS', 'grantStatus=' + (d && d.grantStatus));

      await t.step('再发一次 SUCCESS 通知（新 notifySeq），期望仍 code=0', async () => {
        const cb = await doCallback(a.bizNo, { payAmount: a.orderAmount, notifySeq: newNotifySeq() });
        t.assert(cb && cb.code === 0, `code=${cb && cb.code} —— 重复通知不是错误，不应抛异常`);

      await t.step('期望履约行数与状态不变（未重复发放）', async () => {
        const d = await refresh(a.bizNo);

        t.assert(d.payStatus === before.payStatus, `payStatus ${before.payStatus} → ${d.payStatus}`);

      });

    id: 'amount', name: '支付金额不符', desc: '回调金额改 1 分，期望 1731 且不推进任何状态',

    },
  },
  {
    id: 'payfail', name: '支付失败', desc: '回调 FAILED，期望 PAY_FAILED 且不触发履约',
    async run(t) {
      const a = await t.step('下单', async () => {
        const r = await doTrade({ clientReqNo: newReqNo() });
        t.assert(r && r.code === 0, `code=${r && r.code}`);
        remember(r.data.bizNo, r.data.orderAmount);
        return r.data;
      });
      await t.step('回调 FAILED，期望 code=0', async () => {

  {

    async run(t) {
      await t.step('quantity=3，期望 4001', async () => {

    },

/* ---------- 场景执行器 ---------- */
function buildScenarios() {
  $('scns').innerHTML = SCENARIOS.map(s => `
    <div class="scn" id="scn-${s.id}">
      <div class="scn-h">
        <span class="badge b-idle" id="st-${s.id}">未跑</span>
        <div class="t"><b>${esc(s.name)}</b><div>${esc(s.desc)}</div></div>
        <button class="sm" data-run="${s.id}">运行</button>
      </div>
      <div class="steps" id="steps-${s.id}"></div>
    </div>`).join('');
  document.querySelectorAll('[data-run]').forEach(b => {
    b.onclick = () => runScenario(SCENARIOS.find(s => s.id === b.dataset.run));
  });
  document.querySelectorAll('.scn-h .t').forEach(el => {
    el.onclick = () => el.closest('.scn').classList.toggle('open');
  });
}

class Fail extends Error {}

async function runScenario(s) {
  const box = $('steps-' + s.id), st = $('st-' + s.id);
  const scn = $('scn-' + s.id);
  scn.classList.add('open');
  box.innerHTML = '';
  st.className = 'badge b-wait'; st.textContent = '运行中';
  document.querySelectorAll('[data-run]').forEach(b => b.disabled = true);

  let failed = 0, passed = 0;
  const t = {
    _cur: null,
    async step(label, fn) {
      const el = document.createElement('div');
      el.className = 'step run';
      el.innerHTML = `<span class="ic">◌</span><span class="msg">${esc(label)}</span>`;
      box.appendChild(el);
      t._cur = el;
      try {
        const out = await fn();
        el.className = 'step pass';
        el.querySelector('.ic').textContent = '✓';
        passed++;
        return out;
      } catch (e) {
        el.className = 'step fail';
        el.querySelector('.ic').textContent = '✕';
        el.querySelector('.msg').innerHTML =
          esc(label) + '<div style="color:var(--err)">' + esc(e.message) + '</div>';
        failed++;
        throw e instanceof Fail ? e : new Fail(e.message);
      }
    },
    assert(cond, msg) { if (!cond) throw new Fail(msg || '断言失败'); },
    note(msg) {
      if (!t._cur) return;
      const d = document.createElement('div');
      d.innerHTML = '<em>' + esc(msg) + '</em>';
      t._cur.querySelector('.msg').appendChild(d);
    },
  };

  try { await s.run(t); }
  catch { /* 已在 step 内标记，停在首个失败步 */ }

  document.querySelectorAll('[data-run]').forEach(b => b.disabled = false);
  if (failed) {
    st.className = 'badge b-err'; st.textContent = '失败';
    banner(false, `${s.name}：${failed} 步不符预期`);
  } else {
    st.className = 'badge b-ok'; st.textContent = `通过 ${passed}`;
    banner(true, `${s.name}：${passed} 步全部符合预期`);
  }
  return !failed;
}

/* ---------- 绑定 ---------- */
$('btnNewReq').onclick = () => { $('clientReqNo').value = newReqNo(); banner(true, '已换新 clientReqNo'); };
$('btnTrade').onclick = async () => {
  if (!val('clientReqNo')) $('clientReqNo').value = newReqNo();
  const r = await doTrade();
  if (!r) return;
  if (r.code !== 0) { banner(false, `下单被拒 ${r.code}：${r.message}`); return; }
  remember(r.data.bizNo, r.data.orderAmount);
  select(r.data.bizNo);
  banner(true, `下单成功 ${r.data.bizNo} · 应付 ¥${(r.data.orderAmount / 100).toFixed(2)}`);
  await refresh(r.data.bizNo);
};
async function manualCallback(payStatus) {
  if (!curBizNo) { banner(false, '先下一单，或从下拉里选一个 bizNo'); return; }
  const cb = await doCallback(curBizNo, { payStatus });
  if (!cb) return;
  cb.code === 0
    ? banner(true, `回调已受理 status=${cb.data && cb.data.status}`)
    : banner(false, `回调被拒 ${cb.code}：${cb.message}${CODE_TXT[cb.code] ? ' —— ' + CODE_TXT[cb.code] : ''}`);
  await refresh(curBizNo);
}
$('btnPayOk').onclick = () => manualCallback('SUCCESS');
$('btnPayFail').onclick = () => manualCallback('FAILED');
$('btnQuery').onclick = () => refresh();
$('btnRefresh').onclick = () => refresh();
$('bizPick').onchange = e => { if (e.target.value) { select(e.target.value); refresh(e.target.value); } };
$('btnClearLog').onclick = () => {
  logSeq = 0;
  $('log').innerHTML = '<div class="empty" style="padding:13px">还没有请求</div>';
};
$('btnRunAll').onclick = async e => {
  e.target.disabled = true;
  let ok = 0;
  for (const s of SCENARIOS) if (await runScenario(s)) ok++;
  e.target.disabled = false;
  banner(ok === SCENARIOS.length, `全部场景：${ok}/${SCENARIOS.length} 通过`);
};

buildScenarios();
$('clientReqNo').value = newReqNo();

    const r = await fetch('/api/benefit/order/__healthprobe__');
    $('hDot').className = 'dot ' + (r.ok ? 'up' : 'down');
    $('hTxt').textContent = r.ok ? '服务正常' : 'HTTP ' + r.status;
  } catch {
    $('hDot').className = 'dot down';
    $('hTxt').textContent = '无法连接 8080';
  }
})();
