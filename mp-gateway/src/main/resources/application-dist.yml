# gateway 的分布式形态配置。V4 新增。
#
# 与 application-local.yml 的关键差别：这里没有任何数据源。拆服务后 gateway
# 只做接入层——鉴权、限流、路由、统一响应，业务数据一律经 Dubbo 向后取。
# 四个 DataSourceConfig 随各自模块走，它们的 jar 已不在本服务的 classpath 上。
spring:
  application:
    name: mp-gateway
  autoconfigure:
    # 拆服务后 gateway 不连库也不用锁，但 JDBC 与 Redisson 的 jar 仍随传递依赖在
    # classpath 上：Boot 见状就要找 spring.datasource.url，Redisson 直接试连
    # localhost:6379，两者都会让启动失败。
    #
    # 写在这里而不是 @SpringBootApplication(exclude=...)：注解上的排除项会被 Spring
    # 全局收集，即便那个类不是当前上下文的配置源 —— 单进程形态的 34 个集成测试会被
    # 连累，全报 No qualifying bean of type RedissonClient。
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
  threads:
    virtual:
      enabled: true

server:
  port: ${MP_SERVER_PORT:8080}

dubbo:
  application:
    name: mp-gateway
    qos-enable: false
    logger: slf4j
  protocol:
    name: tri
    # -1 表示随机端口。多副本部署时固定端口会撞，而撞的表现是第二个实例启动失败
    port: -1
    # 注册到注册中心的地址由此指定。
    #
    # 不指定时 Dubbo 自己挑一块网卡，而三机拓扑下每个容器接了两个网络（本层的
    # net-b/net-c 与共用的 net-infra）—— 它挑中层内网段时，别层的服务拿到地址却
    # 路由不过去，表现为 UNAVAILABLE: upstream xxx is unavailable 与 metadata
    # 拉取失败。服务发现看起来一切正常，只有调用全挂。
    #
    # 容器编排注入 MP_DUBBO_HOST（取容器名），走 DNS 解析到 infra 网段，
    # 三层之间由它承载连通性。
    host: ${MP_DUBBO_HOST:}
  registry:
    address: nacos://${MP_NACOS_HOST:localhost}:${MP_NACOS_PORT:8848}
  scan:
    base-packages: com.mp.gateway

mp:
  dubbo:
    remote: true
  # 两个签名端点留在 gateway（见 FaultInjectionController 类注释），
  # 故两把密钥仍需配置。取值须与对应服务一致，否则签出来的验不过
  pay-notify:
    secret: ${MP_PAY_NOTIFY_SECRET:local-dev-pay-notify-secret-do-not-use-in-prod}
  provider-notify:
    secret: ${MP_PROVIDER_NOTIFY_SECRET:local-dev-provider-notify-secret-do-not-use-in-prod}

logging:
  level:
    root: INFO
    com.mp: DEBUG
