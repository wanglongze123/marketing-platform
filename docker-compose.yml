services:
  mysql:
    image: mysql:8
    container_name: mp-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+8:00
    volumes:
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
      - mp-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  # V2 起启用：docker compose --profile v2 up -d
  redis:
    image: redis:7-alpine
    container_name: mp-redis
    profiles: ["v2", "v3", "v4"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ------------------------------------------------------------------
  # V4 中间件：docker compose --profile v4 up -d
  #
  # 端口取《环境与依赖》§3.2 的既定约定，不另起一套。
  # ------------------------------------------------------------------

  # 注册中心。V4 前 dubbo.registry.address=N/A（全 injvm，不注册）。
  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: mp-nacos
    profiles: ["v4"]
    environment:
      # 单机模式，配置存内嵌 derby。生产要换 MySQL，本地演示不必 ——
      # 注册数据本来就是易失的，实例重连即恢复
      MODE: standalone
      # 关掉鉴权：本地演示环境，开了还要在每个服务里配用户名密码
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 512m
      TZ: Asia/Shanghai
    ports:
      - "8848:8848"
      # gRPC 端口，Nacos 2.x 客户端必须能连上它。只开 8848 的话服务能注册但
      # 订阅收不到推送 —— 表现为「注册成功但调用方找不到提供者」
      - "9848:9848"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 30

  # 消息队列，只做跨层事件广播（技术方案 §6.7：一致性不依赖它）。
  rocketmq-namesrv:
    image: apache/rocketmq:5.3.1
    container_name: mp-rocketmq-namesrv
    profiles: ["v4"]
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m -Xmn128m"
      TZ: Asia/Shanghai
    ports:
      - "9876:9876"
    # 用 bash 的 /dev/tcp 探端口：镜像里没有 netstat/nc，而 curl 对非 HTTP 端口
    # 会以协议错误退出，两者都判不出「端口通了」
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9876"]
      interval: 5s
      timeout: 3s
      retries: 20

  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    container_name: mp-rocketmq-broker
    profiles: ["v4"]
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/conf/broker.conf
    environment:
      JAVA_OPT_EXT: "-Xms512m -Xmx512m -Xmn256m"
      TZ: Asia/Shanghai
    volumes:
      - ./docker/rocketmq/broker.conf:/home/rocketmq/conf/broker.conf:ro
    ports:
      - "10911:10911"
      - "10909:10909"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/10911"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ------------------------------------------------------------------
  # 可观测栈（V4 第 5、6、7 项）。与业务服务同 profile，一条命令全起。
  # ------------------------------------------------------------------

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: mp-prometheus
    profiles: ["v4"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
      # 演示环境保留 6 小时够用。默认 15 天会让本地磁盘无谓地涨
      - --web.enable-lifecycle
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 10

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: mp-alertmanager
    profiles: ["v4"]
    volumes:
      - ./docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: mp-grafana
    profiles: ["v4"]
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      # 演示环境关掉登录墙：面试时不想在投屏上敲密码，
      # 而这个实例只监听本机、只读 Prometheus
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
      TZ: Asia/Shanghai
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

volumes:
  mp-mysql-data:
