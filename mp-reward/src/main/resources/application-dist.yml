# reward 服务的分布式形态配置。V4 新增。
spring:
  application:
    name: mp-reward
  threads:
    virtual:
      enabled: true

  datasource:
    reward:
      url: jdbc:mysql://${MP_MYSQL_HOST:localhost}:${MP_MYSQL_PORT:3306}/db_reward?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      username: mp_reward
      password: mp_reward
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        maximum-pool-size: 10
        minimum-idle: 2

server:
  port: ${MP_SERVER_PORT:8082}

dubbo:
  application:
    name: mp-reward
    qos-enable: false
    logger: slf4j
  protocol:
    name: tri
    # -1 表示随机端口。多副本部署时固定端口会撞，而撞的表现是第二个实例启动失败
    port: -1
    # 注册到注册中心的地址由此指定。
    #
    # 不指定时 Dubbo 自己挑一块网卡，而三机拓扑下每个容器接了两个网络（本层的
    # net-b/net-c 与共用的 net-infra）—— 它挑中层内网段时，别层的服务拿到地址却
    # 路由不过去，表现为 UNAVAILABLE: upstream xxx is unavailable 与 metadata
    # 拉取失败。服务发现看起来一切正常，只有调用全挂。
    #
    # 容器编排注入 MP_DUBBO_HOST（取容器名），走 DNS 解析到 infra 网段，
    # 三层之间由它承载连通性。
    host: ${MP_DUBBO_HOST:}
  registry:
    address: nacos://${MP_NACOS_HOST:localhost}:${MP_NACOS_PORT:8848}
  scan:
    base-packages: com.mp.reward

mp:
  dubbo:
    remote: true
  event:
    # 事件传输方式。injvm 形态取默认的 spring（进程内总线），分布式取 rocketmq。
    # 换的只是 RewardEventConfig 里装配哪个 @Bean，发布与消费的业务代码一行不动
    transport: ${MP_EVENT_TRANSPORT:rocketmq}
    # 发奖结果事件开关。置 false 即退出标准第 17 条的对照组：
    # 断言仍由 QUERY_GRANT 收敛到终态、发放记录仍为 1 条
    enabled: ${MP_EVENT_ENABLED:true}
  # 供应方通知验签密钥。本服务是 providerCallback 的接收方，缺它启动即失败
  # （无代码内默认值，见 ConsultTokenConfig 的同类处置与 ShapeFreezeTest 的断言）
  provider-notify:
    secret: ${MP_PROVIDER_NOTIFY_SECRET:local-dev-provider-notify-secret-do-not-use-in-prod}

logging:
  level:
    root: INFO
    com.mp: DEBUG

rocketmq:
  name-server: ${MP_ROCKETMQ_NAMESRV:localhost:9876}
  producer:
    # 生产方。消费方也要配 producer group —— starter 在装配 RocketMQTemplate 时
    # 强制要求它非空，即便本服务从不发消息
    group: mp-grant-result-producer
    # 发送失败不重试：事件是加速手段，丢了由查单兜底。框架层重试会在 broker
    # 短暂不可用时把一次回调处理拖成数秒
    retry-times-when-send-failed: 0

# 指标暴露（V4 第 5、6 项）。Prometheus 抓 /actuator/prometheus
management:
  endpoints:
    web:
      exposure:
        # 只开必要的三个：health 供编排探活，prometheus 供抓取，metrics 供排查。
        # 不开 * —— env / configprops 会把数据库口令与三把签名密钥原样吐出来
        include: health,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      # 所有指标带上服务名，多实例时才分得清是谁的数
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
