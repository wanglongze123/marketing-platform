# mock 下游服务的分布式形态配置。V4 新增。
#
# 它扮演外部系统（支付方、权益供应方、社交关系），故无数据源、无 Flyway ——
# 账本是进程内 ConcurrentHashMap，重启即清空，这是有意的。
spring:
  application:
    name: mp-mock-downstream
  threads:
    virtual:
      enabled: true

server:
  # 端口取《环境与依赖》§3.2 的既定约定
  port: ${MP_SERVER_PORT:8090}

dubbo:
  application:
    name: mp-mock-downstream
    qos-enable: false
    logger: slf4j
  protocol:
    name: tri
    # -1 表示随机端口。多副本部署时固定端口会撞，而撞的表现是第二个实例启动失败
    port: -1
    # 注册到注册中心的地址由此指定。
    #
    # 不指定时 Dubbo 自己挑一块网卡，而三机拓扑下每个容器接了两个网络（本层的
    # net-b/net-c 与共用的 net-infra）—— 它挑中层内网段时，别层的服务拿到地址却
    # 路由不过去，表现为 UNAVAILABLE: upstream xxx is unavailable 与 metadata
    # 拉取失败。服务发现看起来一切正常，只有调用全挂。
    #
    # 容器编排注入 MP_DUBBO_HOST（取容器名），走 DNS 解析到 infra 网段，
    # 三层之间由它承载连通性。
    host: ${MP_DUBBO_HOST:}
  registry:
    address: nacos://${MP_NACOS_HOST:localhost}:${MP_NACOS_PORT:8848}
  scan:
    base-packages: com.mp.mock

mp:
  dubbo:
    remote: true
  # 无签名密钥配置：mock 既不验签也不签发。两个签名端点留在 gateway
  # （见 MockFaultController 类注释），签名器由各自模块 @Bean 显式装配，
  # mp-common 本身不含任何 @Component，扫到也不会要求配置

logging:
  level:
    root: INFO
    com.mp: DEBUG
