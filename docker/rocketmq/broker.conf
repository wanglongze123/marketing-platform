brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# 客户端拿到的 broker 地址。
#
# 不配这一项时 broker 上报的是容器内网 IP（如 172.x.x.x），宿主机上的客户端
# 拿到那个地址后连不上 —— 表现为「namesrv 查得到 broker，发消息却超时」，
# 而这个失败在日志里只是一条 connect timeout，看不出是地址问题。
#
# 容器间调用走服务名，故填服务名；宿主机跑客户端时改为 host.docker.internal。
brokerIP1 = rocketmq-broker

# 自动建 topic。演示环境用，省去手工 mqadmin updateTopic 一步。
# 生产必须关掉：拼错的 topic 会被自动建出来，消息发进一个没人消费的地方。
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true

# 单机演示，磁盘水位放宽。默认 85% 触发拒写，本地开发机磁盘常年高于这个数 ——
# 到时表现为「发消息返回 SERVICE_NOT_AVAILABLE」，而磁盘其实还有几十 G 可用
diskMaxUsedSpaceRatio = 95
