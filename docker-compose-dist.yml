# V4 分布式形态：五服务独立部署，三机拓扑。
#
# 用法（中间件先起，它在主 compose 里）：
#   docker compose --profile v4 up -d           # 机器 A：MySQL/Redis/Nacos/RocketMQ
#   mvn -B package -DskipTests                  # 产出六个 -boot.jar
#   docker compose -f docker-compose-dist.yml up -d --build
#
# ------------------------------------------------------------------
# 三机拓扑（技术方案 §1.6）—— 服务分组见下方注释：
#
#   机器 A  全部中间件（MySQL / Redis / Nacos / RocketMQ）
#   机器 B  gateway + benefit-order + fission（接入与玩法层）
#   机器 C  activity + reward + mock 下游（公共能力层）
#
# 三组共用一个 network。初版给 B、C 各建了一个独立网段想「模拟机器边界」，
# 结果是服务发现正常而调用全部 UNAVAILABLE：容器接了两块网卡，Dubbo 注册时
# 挑中层内网段的 IP（172.19.x / 172.20.x），别层的服务拿到地址却路由不过去。
# 日志里表现为 upstream unavailable 与 metadata 拉取失败，看起来像注册中心
# 出问题，其实是拓扑建错了 —— 真实的三台机器在同一个内网里，B 调 C 是跨机器
# 而不是跨网络隔离。
#
# 分组保留在注释与启动顺序上，这是它本来该有的形态：机器边界体现为「不同进程、
# 经注册中心发现、走网络调用」，而不是「互相 ping 不通」。
# ------------------------------------------------------------------

x-common: &common
  restart: unless-stopped
  environment: &common-env
    TZ: Asia/Shanghai
    SPRING_PROFILES_ACTIVE: dist
    # 中间件都在机器 A，容器间走服务名。这些名字由主 compose 的 container_name 决定
    MP_MYSQL_HOST: mp-mysql
    MP_MYSQL_PORT: "3306"
    MP_REDIS_HOST: mp-redis
    MP_REDIS_PORT: "6379"
    MP_NACOS_HOST: mp-nacos
    MP_NACOS_PORT: "8848"
    MP_ROCKETMQ_NAMESRV: mp-rocketmq-namesrv:9876

services:
  # ---------- 机器 C：公共能力层 ----------
  # 先起：玩法层依赖它们，虽然 check=false 不会因缺提供者而启动失败，
  # 但先起能让第一次调用就命中，省去一轮重试

  activity:
    <<: *common
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MODULE: mp-activity
    image: mp/activity:v4
    container_name: mp-activity
    environment:
      <<: *common-env
      MP_SERVER_PORT: "8081"
    networks: [net-infra]
    ports:
      - "8081:8081"

  reward:
    <<: *common
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MODULE: mp-reward
    image: mp/reward:v4
    container_name: mp-reward
    environment:
      <<: *common-env
      MP_SERVER_PORT: "8082"
    networks: [net-infra]
    ports:
      - "8082:8082"

  mock-downstream:
    <<: *common
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MODULE: mp-mock-downstream
    image: mp/mock-downstream:v4
    container_name: mp-mock
    environment:
      <<: *common-env
      MP_SERVER_PORT: "8090"
    networks: [net-infra]
    ports:
      - "8090:8090"

  # ---------- 机器 B：接入层与玩法层 ----------

  # benefit-order 不设 container_name：kill -9 验证要起多副本，
  # 固定名字会让 --scale 直接失败
  benefit-order:
    <<: *common
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MODULE: mp-benefit-order
    image: mp/benefit-order:v4
    environment:
      <<: *common-env
      # 不映射固定端口，多副本时由 Docker 分配 —— 同理，映射了就没法 --scale
      MP_SERVER_PORT: "8083"
      # 时序参数留给验证脚本覆盖。默认取生产值，见 application-dist.yml 的注释
      MP_TASK_LEASE_SECONDS: "${MP_TASK_LEASE_SECONDS:-30}"
      MP_TASK_INTERVAL_MILLIS: "${MP_TASK_INTERVAL_MILLIS:-1000}"
    networks: [net-infra]

  fission:
    <<: *common
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MODULE: mp-fission
    image: mp/fission:v4
    container_name: mp-fission
    environment:
      <<: *common-env
      MP_SERVER_PORT: "8084"
    networks: [net-infra]
    ports:
      - "8084:8084"

  gateway:
    <<: *common
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MODULE: mp-gateway
    image: mp/gateway:v4
    container_name: mp-gateway
    environment:
      <<: *common-env
      MP_SERVER_PORT: "8080"
    networks: [net-infra]
    ports:
      - "8080:8080"

networks:
  # 中间件所在网络，由主 compose 创建。名字取 <项目名>_default —— 主 compose
  # 没有显式声明 network，Docker 给它建的就是这个
  net-infra:
    external: true
    name: marketing-platform_default
